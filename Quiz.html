<!DOCTYPE html>
<html>
    <head>
        <title> Quiz</title>

    </head>
    <body>
        <div id="d1">
        </div>
		<script>
		let data=[{Question:'What country has the higest life expectancy', Options:['Japan', 'China'], Answer:'China'}, {Question:'What year was US established', Options:['1945', '1925'], Answer:'1925'},{Question:'What is 35*35', Options:['1453', '1225'], Answer:'1225'},{Question:'What lanaunge do people in Mexcio speak', Options:['English', 'Spanish'], Answer:'Spanish'},{Question:'how many days are in the week', Options:['24', '7'], Answer:'7'},]

for(let p of data){
    let div= document.createElement('div')
    let h3= document.createElement('h3')
    let d1= document.getElementById("d1")
    for(let k of p.Options){
        let button= document.createElement('button')
        button.textContent=k
        button.addEventListener("click",function(){
            if(button.textContent===p.Answer)
                alert('Correct')
            else
                alert('Wrong')
        })
        div.appendChild(button)
    }
    h3.textContent=p.Question
    div.appendChild(h3)
    d1.appendChild(div)
}
	</script>

    </body>
</html>
