<!DOCTYPE html>
<html>
    <head>
        <title>  Palindrome Recogniser</title>
    </head>
    <body>
        <center>
            <div>
                <h1>  Palindrome Recogniser</h1>
                <p>Enter Word or Phrase</p>
                <input type="text" id="t1">
                <button type="button" onclick="Palindrome()">Check Palindrome</button>
                <p id="t2"></p>
            </div>
        </center>
	<script>
		function  Palindrome(){
    var a=document.getElementById("t1").value
    var b=a.split('')
    var c=b.reverse()
    var d=c.join('')
    if(a==d){
        document.getElementById("t2").innerHTML="Your word is a Palindrome"
    }
    else{
        document.getElementById("t2").innerHTML="Your word is not a Palindrome"
    }
}
	</script>
    </body>
</html>
